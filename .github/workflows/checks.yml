name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install validation dependencies
        run: npm ci --ignore-scripts
      - name: Lint and test
        run: npm run check
